<!-- tells the browser this file is an HTML5 document -->
<!DOCTYPE html>
<!-- opens the html element, the root of the page; lang="en" says the content is in English -->
<html lang="en">
<!-- opens the head, which holds info about the page that is not shown in the page body -->
<head>
    <!-- sets the character encoding to UTF-8 so symbols like the copyright sign display correctly -->
    <meta charset="UTF-8">
    <!-- makes the page scale to the width of the device so it looks right on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- sets the text shown in the browser tab -->
    <title>My First Web Page</title>
<!-- closes the head section -->
</head>
<!-- opens the body, which holds everything visible on the page -->
<body>
    <!-- opens the header, the introductory section at the top of the page -->
    <header>
        <!-- the main heading of the page, the largest heading level -->
        <h1>My First Web Page</h1>
    <!-- closes the header -->
    </header>
    <!-- opens main, which holds the primary content of the page -->
    <main>
        <!-- a paragraph showing my username; strong makes the label bold -->
        <p><strong>Username:</strong> xs236</p>
        <!-- a paragraph showing the course name -->
        <p><strong>Course Name:</strong> IS</p>
        <!-- a paragraph showing the course number -->
        <p><strong>Course Number:</strong> 117</p>
        <!-- a paragraph showing the course section -->
        <p><strong>Section:</strong> 001</p>
    <!-- closes main -->
    </main>
    <!-- opens the footer, the section at the bottom of the page -->
    <footer>
        <!-- a paragraph with the copyright symbol (&copy;), my name, and the due date -->
        <p>&copy; Xavier Stroman | Due: October 6, 2026</p>
    <!-- closes the footer -->
    </footer>
<!-- closes the body -->
</body>
<!-- closes the html element, ending the document -->
</html>
